# =============================================================================
# volaco-core — accueil public (Nginx)
# =============================================================================
# Rôle : recevoir les visiteurs et transmettre au serveur d'API (conteneur),
# qui n'écoute QUE sur 127.0.0.1:3000 (donc jamais joignable de l'extérieur).
#
# Installation (Ubuntu / Debian) :
#   apt install -y nginx
#   cp nginx.conf /etc/nginx/sites-available/volaco
#   ln -sf /etc/nginx/sites-available/volaco /etc/nginx/sites-enabled/volaco
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
# =============================================================================

# --- Limitation de débit au niveau de l'accueil (défense en profondeur) ------
# ATTENTION : ceci NE remplace PAS la correction à appliquer dans le code
# (voir PATCH-IP-REELLE.md). Le serveur d'API limite lui-même par adresse IP et,
# derrière cet accueil, il voit TOUT LE MONDE à l'adresse 127.0.0.1 : sans la
# correction, tous les visiteurs partagent un unique quota de 600 requêtes/min.
limit_req_zone $binary_remote_addr zone=volaco_api:10m rate=15r/s;

server {
    listen 80;
    listen [::]:80;

    # Remplacer par le vrai nom de domaine dès qu'il pointe ici
    server_name _;

    # Le Studio et les bundles peuvent être volumineux (l'API refuse au-delà de 1 Mo)
    client_max_body_size 4m;

    # --- Retrouver la vraie adresse du visiteur derrière Cloudflare ----------
    # (utile pour les journaux Nginx et pour l'en-tête transmis à l'API)
    # Liste à tenir à jour : https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # --- API : streaming obligatoire (génération en direct) ------------------
    # Sans proxy_buffering off, Nginx accumule la réponse et la génération
    # n'apparaît qu'à la fin — voire jamais si le flux dépasse les délais.
    location /api/ {
        limit_req zone=volaco_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        chunked_transfer_encoding on;
    }

    # --- Bundles React des applications générées (fichiers versionnés ?v=…)
    location /preview-bundle/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 10m;
    }

    # --- Tout le reste (Studio, modules du Builder, images, /health) ---------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Compression (le Studio est une très grosse page HTML) --------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/html text/css text/plain application/javascript application/json image/svg+xml;

    server_tokens off;
}
