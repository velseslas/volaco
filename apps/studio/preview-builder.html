<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Builder — Progressive Preview Renderer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #070913; color: #e2e8f0; }
    .app { display: flex; flex-direction: column; height: 100vh; }

    header.app-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid #1a2238; background: #0a0e1c; }
    header.app-header h1 { font-size: 14px; margin: 0; font-weight: 700; }
    .build-badge { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #475569; }
    .dot.building { background: #a78bfa; box-shadow: 0 0 8px rgba(167,139,250,.5); }
    .dot.completed { background: #34d399; }
    .dot.error { background: #fb7185; }
    a.back { color: #8b5cf6; font-size: 11px; text-decoration: none; margin-left: 16px; }

    .layout { display: grid; grid-template-columns: 300px 1fr; gap: 0; flex: 1; min-height: 0; }
    .panel-build { border-right: 1px solid #1a2238; background: #0a0e1c; padding: 16px; overflow-y: auto; }
    .panel-build h2, .canvas-panel h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: #64748b; margin: 0 0 10px; }
    .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    button { background: #7c3aed; border: none; color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
    button.secondary { background: #1e293b; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .stage { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; font-size: 12px; color: #475569; }
    .stage.current { background: rgba(139,92,246,.14); color: #c4b5fd; font-weight: 600; }
    .stage.done { color: #34d399; }
    .stage::before { content: '○'; }
    .stage.current::before { content: '◉'; }
    .stage.done::before { content: '✓'; }
    .stage.error { color: #fb7185; }
    .stage.error::before { content: '!'; }

    .comp-list { margin-top: 18px; }
    .comp-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; border-radius: 8px; font-size: 11px; color: #64748b; }
    .comp-row .glyph { width: 16px; }
    .comp-row.building { color: #c4b5fd; background: rgba(139,92,246,.08); }
    .comp-row.completed { color: #94a3b8; }
    .comp-row.completed .glyph { color: #34d399; }
    .comp-row.error { color: #fb7185; }

    .canvas-panel { display: flex; flex-direction: column; min-width: 0; }
    .canvas-wrap { flex: 1; overflow: auto; padding: 24px; display: flex; justify-content: center; align-items: flex-start; background: #080b16; }
    .canvas { width: min(820px, 100%); min-height: 60%; border: 1px solid #223052; border-radius: 14px; background: #0b0f1e; padding: 20px; }
    .canvas .placeholder { color: #334155; font-size: 13px; text-align: center; padding: 40px 0; }

    /* ===== NŒUDS ===== */
    .pv-node { border: 1px solid #334155; border-radius: 12px; padding: 14px 18px; margin-bottom: 12px; background: #0d1222; transition: border-color .25s ease, background-color .25s ease; }
    .pv-node .pv-label { font-size: 13px; font-weight: 600; color: #cbd5e1; }
    .pv-node .pv-type { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: #64748b; margin-top: 4px; }
    .pv-node.completed { border-color: #059669; }
    .pv-node.error { border-color: #e11d48; }
    .pv-node.error .pv-label { color: #fb7185; }
    .pv-node .pv-error { font-size: 10px; color: #fb7185; margin-top: 6px; }
    .pv-children { margin-top: 12px; padding-left: 16px; border-left: 1px solid #223052; display: flex; flex-direction: column; gap: 10px; }

    /* ===== LOT 03 — CONSTRUCTION PROGRESSIVE (conséquence du state) ===== */
    /* Squelette → label → contenu : 3 phases CSS enchaînées à l'insertion du
       nœud building. Aucun timer JS : tout est keyframes + animation-delay. */
    .pv-node.building { border-style: dashed; border-color: #7c3aed; background: rgba(124,58,237,.06); }
    .pv-node.building .pv-label { color: #a78bfa; animation: pvLabelIn .5s ease .45s both; }
    .pv-node.building .pv-building-tag { display: inline-block; font-size: 10px; color: #a78bfa; margin-left: 10px; animation: pvLabelIn .4s ease .2s both; }
    .pv-node.building .pv-type { animation: pvLabelIn .4s ease 1.15s both; }
    .pv-ghost { height: 10px; border-radius: 5px; margin-top: 9px;
      background: linear-gradient(90deg, rgba(124,58,237,.12) 25%, rgba(139,92,246,.3) 50%, rgba(124,58,237,.12) 75%);
      background-size: 400px 100%; animation: pvGhostShimmer 1.2s linear infinite, pvGhostFill .7s cubic-bezier(.22,.9,.34,1) both; }
    .pv-ghost.g1 { animation-delay: 0s, .8s; }
    .pv-ghost.g2 { animation-delay: 0s, 1.15s; width: 70%; }
    @keyframes pvGhostShimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    @keyframes pvGhostFill { 0% { opacity: 0; transform: scaleX(.4); transform-origin: left; } 100% { opacity: 1; transform: scaleX(1); } }
    @keyframes pvLabelIn { 0% { opacity: 0; transform: translateY(3px); } 100% { opacity: 1; transform: none; } }

    /* ===== LOT 03 — BUILD FOCUS (dérivé du state, sélecteur pur) ===== */
    .pv-node.focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,.18), 0 4px 22px rgba(124,58,237,.14); }
    .pv-node.focus .pv-building-tag::before { content: '◉ BUILDING…'; font-weight: 700; }

    /* ===== LOT 06 — FOCUS RENFORCÉ + PASSAGE DE TÉMOIN ===== */
    .pv-node { position: relative; }
    .pv-node.focus .pv-focus-banner { display: inline-flex; position: absolute; top: -11px; left: 14px; z-index: 2;
      align-items: center; gap: 5px; background: #7c3aed; color: #fff; font-size: 9px; font-weight: 700;
      padding: 2px 9px; border-radius: 999px; letter-spacing: .07em; box-shadow: 0 2px 8px rgba(124,58,237,.35); }
    /* Passage de témoin : highlight court sur le NOUVEAU focus — l'animation
       retire une classe visuelle, elle ne décide jamais d'un état (spec LOT 06). */
    .pv-node.focus-move { animation: pvFocusMove .7s ease; }
    @keyframes pvFocusMove { 0% { background: rgba(139,92,246,.18); } 100% { background: rgba(124,58,237,.04); } }
    .tree-row.focus-row { border-left: 2px solid #8b5cf6; }
    @media (prefers-reduced-motion: reduce) {
      .pv-node.focus-move { animation: none; }
      .canvas-wrap { scroll-behavior: auto; }
    }

    /* ===== STABILISATION à completed : courte et élégante ===== */
    .pv-node.completed { animation: pvStabilize .25s ease; }
    @keyframes pvStabilize { 0% { box-shadow: 0 0 0 3px rgba(5,150,105,.25); } 100% { box-shadow: none; } }

    /* ===== ERROR local, discret ===== */
    .pv-node.error .pv-error::before { content: '⚠ Component generation failed — '; }

    /* ===== ACCESSIBILITÉ : reduced-motion → les changements d'état restent,
       les animations disparaissent ===== */
    @media (prefers-reduced-motion: reduce) {
      .pv-node, .pv-node *, .pv-ghost, .pv-label, .dot { animation: none !important; transition: none !important; }
    }

    /* ===== LOT 04 — PROGRESSION (dérivée du state, pas de compteur) ===== */
    .progress-wrap { height: 6px; border-radius: 3px; background: #161c2e; overflow: hidden; margin-bottom: 6px; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #7c3aed, #34d399); transition: width .3s ease; }

    /* ===== LOT 04 — CONSTRUCTION TREE (arbre indenté dérivé du state) ===== */
    .tree-row { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; font-size: 11px; color: #64748b; }
    .tree-row .glyph { width: 14px; text-align: center; }
    .tree-row.completed { color: #94a3b8; }
    .tree-row.completed .glyph { color: #34d399; }
    .tree-row.building { color: #c4b5fd; background: rgba(139,92,246,.08); }
    .tree-row.building .glyph { color: #a78bfa; }
    .tree-row.pending { color: #475569; }
    .tree-row.error { color: #fb7185; }
    .tree-row .type { font-size: 9px; color: #475569; margin-left: auto; }
    .tree-row.focus-row { background: rgba(139,92,246,.12); }

    /* ===== ÉTAPE 05 — VISUAL COMPONENT SYSTEM (registry → CSS) ===== */
    /* Les visuels sont produits par visuals.js (HTML sémantique + classes
       pvz-*) ; cette feuille décide uniquement de leur apparence. */
    .pvz-anim { animation: pvzIn .5s ease both; }
    @keyframes pvzIn { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: none; } }
    .pvz-ghosts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }

    .pvz-header { display: flex; align-items: center; gap: 18px; padding: 12px 16px; border-radius: 10px; background: #0f1526; border: 1px solid #223052; }
    .pvz-brand { font-weight: 700; font-size: 13px; color: #e2e8f0; }
    .pvz-nav { display: flex; gap: 14px; margin-left: auto; }
    .pvz-nav-item { font-size: 11px; color: #94a3b8; }
    .pvz-cta { font-size: 11px; font-weight: 600; color: #fff; background: #7c3aed; padding: 6px 12px; border-radius: 8px; }

    .pvz-sidebar { display: flex; flex-direction: column; gap: 8px; }
    .pvz-side-item { font-size: 11px; color: #94a3b8; padding: 7px 10px; border-radius: 8px; background: #0f1526; border: 1px solid #1a2238; }

    .pvz-content { padding: 6px 0; }
    .pvz-zone-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #475569; }

    .pvz-card { border: 1px solid #1e293b; border-radius: 12px; padding: 14px 16px; background: #0f1526; }
    .pvz-card-title { font-size: 11px; color: #94a3b8; }
    .pvz-card-value { font-size: 20px; font-weight: 700; color: #f1f5f9; margin-top: 6px; }
    .pvz-card-delta { font-size: 11px; color: #34d399; margin-top: 4px; }

    .pvz-chart { padding: 8px 0; }
    .pvz-bars { display: flex; align-items: flex-end; gap: 8px; height: 90px; }
    .pvz-bar { flex: 1; background: linear-gradient(180deg, #8b5cf6, #4c1d95); border-radius: 6px 6px 2px 2px; min-height: 8px; }

    .pvz-table { display: flex; flex-direction: column; gap: 6px; }
    .pvz-table-row { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; padding: 8px 10px; background: #0f1526; border-radius: 8px; border: 1px solid #1a2238; }

    .pvz-generic { font-size: 12px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
    .pvz-type-tag { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: #475569; border: 1px solid #1e293b; padding: 2px 8px; border-radius: 999px; }

    /* Ghosts propres au registry : mêmes keyframes que le moteur visuel */
    .pvz-ghosts .pv-ghost { height: 12px; }

    /* ===== ÉTAPE 07 — COMPOSITIONS + VIEWPORTS (mode d'affichage pur) ===== */
    .vp-switch { display: flex; gap: 6px; margin-right: 18px; }
    .vp-btn { padding: 5px 12px; font-size: 11px; background: #1e293b; color: #94a3b8; }
    .vp-btn.active { background: #7c3aed; color: #fff; }

    .pv-root-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .pv-root-row { display: flex; gap: 14px; align-items: stretch; flex: 1; min-width: 0; }
    .pv-root-row > .pv-node, .pv-root-row > .pv-comp-col, .pv-root-row > .pv-comp-grid { flex: 1; min-width: 0; }
    .pv-comp-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; flex: 1; }
    .pv-comp-row { display: flex; gap: 12px; min-width: 0; }
    .pv-comp-row > * { flex: 1; min-width: 0; }
    .pv-comp-grid { display: grid; grid-template-columns: repeat(var(--pv-cols, 2), 1fr); gap: 12px; min-width: 0; }
    .pv-comp-stack { display: grid; }
    .pv-comp-stack > * { grid-area: 1 / 1; }

    .canvas.vp-tablet { max-width: 640px; margin: 0 auto; width: 100%; }
    .canvas.vp-mobile { max-width: 390px; margin: 0 auto; width: 100%; }
    .canvas.vp-tablet .pv-root-row { flex-direction: column; }
    .canvas.vp-mobile .pv-root-row { flex-direction: column; }
    .canvas.vp-mobile .pv-comp-row { flex-direction: column; }
    .canvas.vp-mobile .pv-comp-grid { grid-template-columns: 1fr; }

    /* STATUSBAR */
    .statusbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-top: 1px solid #1a2238; background: #0a0e1c; font-size: 12px; color: #94a3b8; }
    .statusbar .err { color: #fb7185; }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Preview Builder</h1>
      <div style="display:flex; align-items:center;">
        <div class="build-badge">
          <div class="vp-switch">
            <button class="secondary vp-btn active" data-vp="desktop">Desktop</button>
            <button class="secondary vp-btn" data-vp="tablet">Tablet</button>
            <button class="secondary vp-btn" data-vp="mobile">Mobile</button>
          </div>
          <span class="dot" id="statusDot"></span><span id="statusBadge">Idle</span>
        </div>
        <a class="back" href="/">← Studio</a>
      </div>
    </header>

    <div class="layout">
      <aside class="panel-build">
        <h2>Build</h2>
  <div class="controls">
    <button id="btnStart">START BUILD</button>
    <button id="btnSse">START (SSE simulée)</button>
    <button id="btnReset" class="secondary">RESET</button>
  </div>
        <div id="stageLadder"></div>

        <h2 style="margin-top:18px;">Progress</h2>
        <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
        <div id="progressText" style="font-size:11px; color:#94a3b8;">Components: 0/0</div>

        <h2 style="margin-top:18px;">Component Tree</h2>
        <div id="compTree"></div>
      </aside>

      <section class="canvas-panel">
        <h2>Live Preview</h2>
        <div class="canvas-wrap">
          <div class="canvas" id="canvas"></div>
        </div>
      </section>
    </div>

    <footer class="statusbar">
      <span id="progressLabel">Components: 0/0</span>
      <span id="footerStatus">Idle</span>
    </footer>
  </div>

  <script type="module">
    import { applyBuildEvent, createPreviewBuildState, BUILD_STAGES } from '/preview-builder/engine.js';
    import { renderPreview, buildTimeline } from '/preview-builder/renderer.js';
    import { layoutTree } from '/preview-builder/layout.js';
    import { renderComponentVisual } from '/preview-builder/visuals.js';
    import { demoBuildScript, scriptToEvents } from '/preview-builder/mocks.js';
    import { MockBuildEventSource, SSEBuildEventSource } from '/preview-builder/adapter.js';
    import { demoSseChunks } from '/preview-builder/mocks.js';
    const btnSse = document.getElementById('btnSse');

    const el = (id) => document.getElementById(id);
    let state = createPreviewBuildState();
    let lastFocusId = null;
    let timer = null;

    /* ---------- LOT 03 — render DOM INCRÉMENTAL ---------- */
    /* Le canvas est synchronisé par data-pv-id : un nœud n'est recréé QUE
       lorsque son STATUT (ou son focus) change — c'est ce changement qui
       déclenche les animations CSS de construction. Les animations sont une
       conséquence du state, jamais sa source (aucun timer ne décide d'un état). */

    /* ===== ÉTAPE 07 — SYNC PAR COMPOSITION (layoutTree(state) → DOM) =====
       Les conteneurs racines (pv-root-col / pv-root-row) et les wrappers de
       composition (pv-comp-col/row/grid/stack) sont upsertés par identité ;
       le DOM incrémental data-pv-id reste la règle pour les nœuds. */
    function syncLayout(focusId) {
      const canvas = el('canvas');
      const { groups } = layoutTree(state);

      // Retire les nœuds et conteneurs disparus
      [...canvas.querySelectorAll('[data-pv-id]')].forEach((nodeEl) => {
        const stillVisible = groups.some((g) => g.nodes.some((ln) => ln.component.id === nodeEl.dataset.pvId));
        if (!stillVisible) nodeEl.remove();
      });
      [...canvas.querySelectorAll(':scope > [data-root-group]')].forEach((wrap) => {
        const i = Number(wrap.dataset.rootGroup);
        const g = groups[i];
        if (i >= groups.length || !g || g.kind !== wrap.dataset.rootKind) wrap.remove();
      });

      // Placeholder quand aucune construction visible
      const totalVisible = groups.reduce((acc, g) => acc + g.nodes.length, 0);
      let ph = canvas.querySelector('.placeholder');
      if (totalVisible === 0 && !ph) canvas.innerHTML = '<div class="placeholder">construction…</div>';
      if (totalVisible > 0 && ph) ph.remove();

      groups.forEach((group, i) => {
        let wrap = canvas.querySelector(':scope > [data-root-group="' + i + '"]');
        if (!wrap) {
          wrap = document.createElement('div');
          wrap.dataset.rootGroup = String(i);
          wrap.dataset.rootKind = group.kind;
          wrap.className = 'pv-root-' + group.kind;
          canvas.appendChild(wrap);
        }
        for (const ln of group.nodes) upsertLayoutNode(wrap, ln, focusId);
      });
    }

    function upsertLayoutNode(parentEl, ln, focusId) {
      const c = ln.component;
      const isFocus = focusId === c.id;
      let nodeEl = parentEl.querySelector(':scope > [data-pv-id="' + c.id + '"]');
      if (!nodeEl) {
        nodeEl = document.createElement('div');
        nodeEl.dataset.pvId = c.id;
        nodeEl.dataset.pvStatus = '';
        parentEl.appendChild(nodeEl);
      }
      if (nodeEl.dataset.pvStatus !== c.status || nodeEl.classList.contains('focus') !== isFocus) {
        nodeEl.className = 'pv-node ' + c.status + (isFocus ? ' focus' : '');
        nodeEl.innerHTML = nodeInner(c, isFocus);
        nodeEl.dataset.pvStatus = c.status;
      }
      // Wrapper de composition des enfants (kind dérivé du state)
      let wrap = nodeEl.querySelector(':scope > .pv-children');
      const kind = ln.layout.kind;
      if (ln.children.length) {
        if (!wrap) {
          wrap = document.createElement('div');
          wrap.className = 'pv-children pv-comp-' + kind;
          if (kind === 'grid') wrap.style.setProperty('--pv-cols', String(ln.layout.columns));
          nodeEl.appendChild(wrap);
        } else {
          wrap.className = 'pv-children pv-comp-' + kind;
          if (kind === 'grid') wrap.style.setProperty('--pv-cols', String(ln.layout.columns));
        }
        for (const child of ln.children) upsertLayoutNode(wrap, child, focusId);
      } else if (wrap) {
        wrap.remove();
      }
    }

    function nodeInner(c, isFocus) {
      // ÉTAPE 05 — le VISUEL vient du registry (type → représentation), au
      // statut réel du state : building = titre + zones ghost, completed =
      // contenu final révélé. Type inconnu → visuel générique.
      if (c.status === 'error') {
        return '<div><span class="pv-label">' + c.label + '</span></div><div class="pv-error">' + (c.error || 'generation failed') + '</div>';
      }
      const visual = renderComponentVisual({ id: c.id, type: c.type, label: c.label, metadata: c.metadata }, c.status === 'building' ? 'building' : 'completed');
      if (c.status === 'building') {
        const banner = isFocus ? '<div class="pv-focus-banner"><span>◉</span> BUILDING</div>' : '';
        return banner + '<div><span class="pv-label">' + c.label + '</span><span class="pv-building-tag"></span></div>' + visual;
      }
      return visual;
    }

    /* ---------- RENDU GLOBAL (state → model → DOM) ---------- */
    function render(model) {
      const dot = el('statusDot'), badge = el('statusBadge');
      dot.className = 'dot ' + (model.status === 'building' ? 'building' : model.status === 'completed' ? 'completed' : model.status === 'error' ? 'error' : '');
      badge.textContent = model.statusLabel;
      badge.style.color = model.status === 'building' ? '#c4b5fd' : model.status === 'completed' ? '#34d399' : model.status === 'error' ? '#fb7185' : '#94a3b8';

      // LOT 06 — PASSAGE DE TÉMOIN : quand le focus CHANGE d'id, le nouveau
      // nœud reçoit un highlight court (classe visuelle retirée par l'anim CSS
      // — aucun état modifié, aucune décision venue de l'animation).
      const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (model.focusId && model.focusId !== lastFocusId && !reducedMotion) {
        const newNode = el('canvas').querySelector('[data-pv-id="' + model.focusId + '"]');
        if (newNode) {
          newNode.classList.remove('focus-move');
          void newNode.offsetWidth; // rejoue l'animation
          newNode.classList.add('focus-move');
          newNode.addEventListener('animationend', () => newNode.classList.remove('focus-move'), { once: true });
        }
      }
      lastFocusId = model.focusId || null;

      // LOT 04 — BUILD TIMELINE : dérivée de buildTimeline(state) — l'échelle
      // et la ligne « error » viennent du même state que le canvas.
      const steps = buildTimeline(state);
      el('stageLadder').innerHTML = steps.map((s) => {
        const cls = s.status === 'active' ? 'stage current' : s.status === 'completed' ? 'stage done' : 'stage';
        return '<div class="' + cls + '">' + s.stage + '</div>';
      }).join('') + (model.status === 'error' ? '<div class="stage error">error — ' + canonicalize(model.buildError || 'échec') + '</div>' : '');

      // LOT 04 — PROGRESSION : fraction réelle des composants terminés
      const pct = model.counts.total > 0 ? Math.round((model.counts.completed / model.counts.total) * 100) : 0;
      el('progressBar').style.width = pct + '%';
      el('progressText').textContent = model.progressLabel;

      // LOT 04 — CONSTRUCTION TREE : arbre indenté dérivé du model (pré-ordre
      // + depth), glyphes par statut, focus identifié (même state que le canvas)
      const glyphs = { building: '◉', completed: '✓', pending: '○', error: '⚠' };
      el('compTree').innerHTML = model.flat.map((n) => {
        const focusTag = n.isBuildFocus ? ' <span style="color:#a78bfa;">construction…</span>' : '';
        return '<div class="tree-row ' + n.status + (n.isBuildFocus ? ' focus-row' : '') + '" style="margin-left:' + (n.depth * 16) + 'px;">'
          + '<span class="glyph">' + (glyphs[n.status] || '○') + '</span>'
          + '<span>' + n.label + focusTag + '</span>'
          + '<span class="type">' + n.type + '</span></div>';
      }).join('') || '<div class="tree-row">—</div>';

      syncLayout(model.focusId);

      // LOT 06 — AUTO-SCROLL doux : uniquement si le focus est réellement hors
      // de la zone visible ; 'nearest' = déplacement minimal, jamais forcé.
      const focusEl = model.focusId ? el('canvas').querySelector('[data-pv-id="' + model.focusId + '"]') : null;
      if (focusEl) {
        const wrap = focusEl.closest('.canvas-wrap');
        const fr = focusEl.getBoundingClientRect();
        const wr = wrap ? wrap.getBoundingClientRect() : null;
        if (wr && (fr.top < wr.top + 8 || fr.bottom > wr.bottom - 8)) {
          focusEl.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'nearest' });
        }
      }

      el('progressLabel').textContent = model.progressLabel;
      const footer = el('footerStatus');
      // LOT 06 — statusbar dérivée du même buildFocus : « ● Building Revenue... »
      const focusNode = model.focusId ? model.flat.find((n) => n.id === model.focusId) : null;
      if (model.status === 'error') { footer.textContent = model.statusLabel; footer.className = 'err'; }
      else if (focusNode) { footer.innerHTML = '<span class="dot building" style="display:inline-block;margin-right:8px;"></span>Building ' + canonicalize(focusNode.label) + '...'; footer.className = ''; }
      else { footer.textContent = model.statusLabel; footer.className = ''; }
    }

    function canonicalize(text) { return String(text).replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    /* ---------- Pipeline : EVENT → ENGINE → STATE → RENDERER → CANVAS ---------- */
    function consume(event) {
      state = applyBuildEvent(state, event);
      render(renderPreview(state));
    }

    // ÉTAPE 08 — DEUX SOURCES interchangeables, le moteur ne voit que des
    // PreviewBuildEvents (BuildEventSource, spec §problème 2) :
    //   - MockBuildEventSource    : scénario démo (par défaut)
    //   - SSEBuildEventSource     : transport SSE simulé → adapter → moteur
    // La bascule se fait par le bouton ; aucune logique du moteur ne change.
    let activeSource = null;

    function startWith(source) {
      if (timer) { clearInterval(timer); timer = null; }
      if (activeSource) { activeSource.stop(); activeSource = null; }
      state = createPreviewBuildState();
      lastFocusId = null;
      btnStart.disabled = true;
      activeSource = source.subscribe(
        (event) => consume(event),
        () => { btnStart.disabled = false; }
      );
    }

    btnStart.addEventListener('click', () => {
      const events = scriptToEvents(demoBuildScript());
      startWith(new MockBuildEventSource({ events, intervalMs: 300 }));
    });

    // SSE simulée : le transport produit du TEXTE SSE brut (avec bruit) —
    // l'adaptateur parse/valide/normalise, le moteur ne sait rien du SSE.
    btnSse.addEventListener('click', () => {
      const chunks = demoSseChunks();
      let i = 0;
      const encoder = new TextEncoder();
      const fakeStream = {
        getReader: () => ({
          read: async () => (i < chunks.length ? { done: false, value: encoder.encode(chunks[i++]) } : { done: true, value: undefined })
        })
      };
      startWith(new SSEBuildEventSource({ url: 'sse://demo', fetchImpl: function () { return Promise.resolve({ ok: true, body: fakeStream }); } }));
    });

    btnReset.addEventListener('click', () => {
      if (timer) { clearInterval(timer); timer = null; btnStart.disabled = false; }
      if (activeSource) { activeSource.stop(); activeSource = null; }
      consume({ kind: 'BUILD_RESET', timestamp: Date.now() });
    });

    // ÉTAPE 07 — VIEWPORTS : mode d'affichage pur (classList sur le canvas).
    // Aucun re-render, aucun état modifié, la construction continue telle quelle.
    document.querySelectorAll('.vp-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.vp-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        const canvas = el('canvas');
        canvas.classList.remove('vp-desktop', 'vp-tablet', 'vp-mobile');
        canvas.classList.add('vp-' + btn.dataset.vp);
      });
    });

    render(renderPreview(state));
  </script>
</body>
</html>
